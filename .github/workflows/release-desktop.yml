# Desktop release: builds the offline macOS app and attaches the
# installers to a GitHub Release. The in-app auto-updater
# (electron-updater) reads these releases to offer updates.
#
# Trigger: push a version tag (e.g. `git tag v1.3.0 && git push origin v1.3.0`)
# or run manually from the Actions tab (workflow_dispatch).
#
# Unsigned local signing is used (CSC_IDENTITY_AUTO_DISCOVERY=false).
# For seamless auto-install on macOS, add Developer ID signing +
# notarization secrets later: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID, CSC_LINK, CSC_KEY_PASSWORD.

name: release-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build macOS installers
        # NOTE: --publish never on purpose. electron-builder only uploads
        # into draft releases and skips every file when the release is
        # already published — so assets are uploaded with `gh` below.
        run: bun run electron:dist:mac-all

      - name: Create the GitHub Release if missing
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Upload installers to the release
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          shopt -s nullglob
          FILES=(dist/*.dmg dist/*.zip dist/latest-mac.yml)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installer artifacts found in dist/" >&2
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
